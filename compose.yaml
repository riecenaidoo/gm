name: gm
services:
  # [gm-ui v1.1.0]
  ui:
    container_name: "gm-ui"
    image: gm-ui:latest
    build:
      context: "./gm-ui"
      dockerfile: "./Dockerfile"
    ports:
      - "4200:80"
    depends_on:
      - storage
  # [gm-storage v1.1.0]
  storage:
    container_name: "gm-storage"
    image: gm-storage:latest
    build:
      context: "./gm-storage"
      dockerfile: "./Dockerfile"
    expose:
      - "8080"
    environment:
      # [How we resolve hostname 'db'](https://docs.docker.com/compose/networking/)
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/gm
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=admin
    env_file:
      # Use APP_CLIENT_URL configs
      - "./gm-ui/.env"
    depends_on:
      - db
  db:
    container_name: "gm-db"
    image: postgres:14.12-bullseye
    # [Source](https://www.docker.com/blog/how-to-use-the-postgres-docker-official-image/)
    environment:
      # [Environment Variables for Postgres Img](https://hub.docker.com/_/postgres)
      - POSTGRES_DB=gm
      - POSTGRES_PASSWORD=admin
    volumes:
      # This is where the DDL would go, for now it just is a placeholder.
      - "./gm-storage/core/src/main/resources/:/docker-entrypoint-initdb.d/"
      # Persist data between sessions.
      - data:/var/lib/postgresql/data
  # [gm-discord v1.1.0]
  discord:
    container_name: "gm-discord"
    image: gm-discord:latest
    build:
      context: "./gm-discord"
      dockerfile: "./Dockerfile"
    expose:
      - "5050"
    env_file:
      - "./gm-discord/.env"
volumes:
  data:
